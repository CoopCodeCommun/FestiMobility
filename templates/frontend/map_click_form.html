<div id="map-click-form" class="card shadow" style="position:absolute; z-index:1000; min-width:300px;">
    <div class="card-body">
        <h5 class="card-title">Que souhaitez-vous faire à cet endroit&nbsp;?</h5>
        <p class="mb-3 text-muted small">Coordonnées : <span id="clicked-coords">(lat, lng)</span></p>
        <div class="d-flex gap-2">
            <button id="btn-proposer-trajet" class="btn btn-primary flex-fill">Proposer un trajet</button>
            <button id="btn-demander-passager" class="btn btn-outline-secondary flex-fill">Demander à être récupéré</button>
        </div>
        <button id="btn-close-map-form" class="btn btn-link btn-sm mt-2 float-end">Fermer</button>
    </div>
</div>
