<form id="conducteur-form" hx-post="/proposer-trajet/" hx-target="#map-form-container" hx-swap="outerHTML" method="POST">
    {% csrf_token %}
    <input type="hidden" name="latitude_depart" id="form-latitude" value="{{ latitude_depart }}" />
    <input type="hidden" name="longitude_depart" id="form-longitude" value="{{ longitude_depart }}" />
    <div class="mb-2">
        <label for="form-nom" class="form-label">Nom</label>
        <input type="text" class="form-control" name="nom" id="form-nom" required />
    </div>
    <div class="mb-2">
        <label for="form-email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" id="form-email" required />
    </div>
    <div class="mb-2">
        <label for="form-telephone" class="form-label">Téléphone</label>
        <input type="text" class="form-control" name="telephone" id="form-telephone" />
    </div>
    <div class="mb-2">
        <label for="form-ville" class="form-label">Ville de départ</label>
        <input type="text" class="form-control" name="ville_depart" id="form-ville" required />
    </div>
    <div class="mb-2">
        <label for="form-nb-places" class="form-label">Nombre de places</label>
        <input type="number" class="form-control" name="nb_places" id="form-nb-places" min="1" max="8" value="3" required />
    </div>
    <div class="mb-2">
        <label for="form-evenement" class="form-label">Événement</label>
        <select class="form-select" name="evenement" id="form-evenement" required>
            {% for event in evenements %}
            <option value="{{ event.id }}" {% if event.id|stringformat:'s' == event_id|stringformat:'s' %}selected{% endif %}>{{ event.nom }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-2">
        <label for="form-heure" class="form-label">Heure de départ</label>
        <input type="time" class="form-control" name="heure_depart" id="form-heure" required value="{{ heure_depart_default }}" />
    </div>
    <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-success flex-fill">Valider</button>
        <button type="button" class="btn btn-link flex-fill" onclick="document.getElementById('map-form-container').innerHTML = ''">Annuler</button>
    </div>
</form>
