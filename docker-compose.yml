services:
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla
    command: valhalla_service /data/valhalla/valhalla.json
    ports:
      - "8002:8002"
    environment:
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - VALHALLA_SERVICE_PORT=8002
    volumes:
      - ./custom_files:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/route"]
      interval: 30s
      timeout: 10s
      retries: 5

